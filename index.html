<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北疆金秋大冒險｜旅遊手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE1;
  --card:#FFFDF6;
  --ink:#221F19;
  --pink:#F1CFD6;
  --pink-deep:#DD8FA3;
  --green:#8CAA8A;
  --green-deep:#587C5C;
  --mustard:#EFBE4A;
  --mustard-deep:#C99A2E;
  --terracotta:#E17F5A;
  --terracotta-deep:#C25D3B;
  --purple:#B7A6D9;
  --sky:#8FBFCF;
  --sky-deep:#4C8FA3;
  --line:#221F19;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans TC', sans-serif;
  overflow:hidden;
}
.app{ display:flex; height:100vh; width:100vw; }

/* ============ SIDEBAR ============ */
.sidebar{ width:236px; min-width:236px; background:#FFFCF3; border-right:2px solid var(--line); padding:22px 0; overflow-y:auto; position:relative; z-index:5; }
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--pink-deep);border-radius:3px;}
.sidebar-brand{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:21px; padding:0 20px 16px 20px; color:var(--ink); letter-spacing:0.5px; border-bottom:2px dashed var(--line); margin-bottom:10px; }
.sidebar-brand span{display:block;font-family:'Noto Sans TC';font-size:10.5px;color:var(--pink-deep);font-weight:700;margin-top:4px;letter-spacing:2px;}
.chapter-label{ font-size:11px; letter-spacing:2px; color:var(--green-deep); padding:14px 20px 6px 20px; font-weight:800; }
.nav-item{ display:flex; align-items:center; gap:10px; margin:2px 10px; padding:7px 12px; font-size:13px; cursor:pointer; color:#5c5648; transition:all .15s; border-radius:12px; border:2px solid transparent; line-height:1.4; }
.nav-item:hover{background:var(--pink); border-color:var(--line); color:var(--ink);}
.nav-item.active{ background:var(--green); border-color:var(--line); color:#fff; font-weight:800; }
.nav-item .num{ font-family:'Baloo 2', sans-serif; font-size:12px; width:18px; min-width:18px; font-weight:800; opacity:0.7; }

/* ============ STAGE ============ */
.stage{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; padding:34px 40px; }
.book{ position:relative; width:100%; max-width:960px; height:100%; max-height:820px; }
.page-card{ position:absolute; inset:0; background:var(--card); border-radius:26px; border:2.5px solid var(--line); box-shadow:8px 8px 0 rgba(34,31,25,0.12); overflow:hidden; opacity:0; transform:translateX(40px) scale(0.98); pointer-events:none; transition:opacity .35s ease, transform .35s ease; }
.page-card.active{ opacity:1; transform:translateX(0) scale(1); pointer-events:auto; }
.page-card.prev{ transform:translateX(-40px) scale(0.98); }

.page-scroll{ position:absolute; inset:0; overflow-y:auto; padding:34px 44px 90px 44px; }
.page-scroll::-webkit-scrollbar{width:8px;}
.page-scroll::-webkit-scrollbar-thumb{background:var(--pink);border-radius:4px;}

.page-topbar{ display:flex; justify-content:space-between; align-items:center; font-family:'Baloo 2', sans-serif; font-size:11.5px; color:var(--pink-deep); letter-spacing:1px; margin-bottom:8px; font-weight:700; }
.page-topbar .chip{ background:var(--pink); border:1.5px solid var(--line); padding:3px 12px; border-radius:20px; font-weight:800; color:var(--ink); }

h1.page-title{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:36px; color:var(--ink); margin:2px 0 2px 0; line-height:1.2; }
h1.page-title small{ display:block; font-family:'Noto Sans TC'; font-size:12.5px; font-weight:700; color:var(--sky-deep); margin-top:7px; letter-spacing:0.5px; }
.squiggle{width:64px; height:10px; margin:6px 0 4px 0; display:block;}
h2.section-title{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:20px; color:var(--terracotta-deep); margin:24px 0 10px 0; display:flex; align-items:center; gap:8px; }
h3.sub-title{ font-size:14px; font-weight:800; color:var(--sky-deep); margin:14px 0 6px 0; text-transform:uppercase; letter-spacing:0.5px; }
p{line-height:1.85; font-size:13.5px; margin:7px 0; color:#413c31;}
.lead{font-size:15.5px; color:var(--ink); font-weight:500;}

table{ width:100%; border-collapse:collapse; margin:10px 0 18px 0; font-size:13px; background:#fff; border-radius:14px; overflow:hidden; border:2px solid var(--line); }
th{ background:var(--green); color:#fff; padding:9px 12px; text-align:left; font-weight:800; font-size:12px; }
td{ padding:8px 12px; border-bottom:1.5px solid #EFE8D5; vertical-align:top; }
tr:last-child td{border-bottom:none;}
tr:nth-child(even) td{background:#FBF6E9;}

.callout{ background:var(--pink); border:2px solid var(--line); border-radius:16px; padding:12px 16px; margin:14px 0; font-size:13.5px; }
.callout.blue{background:#E4F1F4; }
.callout.green{background:#EAF1E7;}

.egg-task{ margin-top:20px; background:#FFF3D6; border:2.5px dashed var(--terracotta-deep); border-radius:18px; padding:14px 18px; font-size:13.5px; }
.egg-task .egg-label{ font-family:'Baloo 2', sans-serif; font-weight:800; color:var(--terracotta-deep); font-size:14.5px; margin-bottom:4px; display:flex; align-items:center; gap:6px; }

.tag-row{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.tag{ background:#fff; border:2px solid var(--line); color:var(--ink); padding:4px 13px; border-radius:20px; font-size:12px; font-weight:800; }
.stars{color:var(--mustard); letter-spacing:1px;}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:0 26px;}
@media (max-width:760px){.two-col{grid-template-columns:1fr;}}

/* ============ pill button ============ */
.pill-btn{ display:inline-flex; align-items:center; justify-content:center; background:var(--green); color:#fff; border:2px solid var(--line); border-radius:999px; padding:6px 16px; font-weight:800; font-size:12.5px; cursor:pointer; box-shadow:2px 2px 0 var(--line); transition:transform .1s; }
.pill-btn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--line);}

/* ============ highlight cards (colorful photo-tile style) ============ */
.highlight-grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; margin:12px 0 8px 0; }
@media (max-width:760px){.highlight-grid{grid-template-columns:1fr;}}
.highlight-card{ background:#fff; border:2px solid var(--line); border-radius:16px; padding:0; overflow:hidden; }
.highlight-card.wide{grid-column:1/-1;}
.highlight-card .hc-head{ display:flex; align-items:center; gap:8px; font-weight:800; color:#fff; font-size:14.5px; padding:11px 14px; }
.highlight-card .hc-icon{ font-size:21px; }
.highlight-card p{margin:0; font-size:12.5px; line-height:1.7; padding:10px 14px 13px 14px;}
.highlight-grid .highlight-card:nth-child(6n+1) .hc-head{background:var(--terracotta);}
.highlight-grid .highlight-card:nth-child(6n+2) .hc-head{background:var(--green-deep);}
.highlight-grid .highlight-card:nth-child(6n+3) .hc-head{background:var(--sky-deep);}
.highlight-grid .highlight-card:nth-child(6n+4) .hc-head{background:var(--pink-deep);}
.highlight-grid .highlight-card:nth-child(6n+5) .hc-head{background:var(--mustard-deep);}
.highlight-grid .highlight-card:nth-child(6n+6) .hc-head{background:var(--purple);}

/* ============ day banner (big number, rotating colors) ============ */
.day-banner{ position:relative; border:2.5px solid var(--line); border-radius:22px; padding:18px 22px; margin-bottom:16px; overflow:hidden; color:#fff; }
.day-banner .db-num{ font-family:'Baloo 2'; font-weight:800; font-size:76px; position:absolute; right:10px; top:-14px; opacity:0.28; line-height:1; color:#fff; }
.day-banner .db-tag{font-family:'Baloo 2'; font-size:11px; letter-spacing:3px; font-weight:700; opacity:0.9;}
.day-banner h1{font-family:'Baloo 2'; font-weight:800; font-size:28px; margin:4px 0; color:#fff; position:relative; z-index:2;}
.day-banner .db-meta{font-size:12.5px; display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; position:relative; z-index:2;}
.day-banner .db-meta span{background:rgba(255,255,255,0.24); padding:3px 12px; border-radius:12px; font-weight:700;}

/* ============ section divider (decorative) ============ */
.section-divider{ display:flex; align-items:center; justify-content:center; margin:16px 0; }
.section-divider .sd-circle{ width:34px; height:34px; border-radius:50%; background:var(--mustard); border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; }

/* ============ timeline ============ */
.timeline{ margin:14px 0 20px 0; position:relative; padding-left:26px; }
.timeline::before{ content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:repeating-linear-gradient(to bottom, var(--terracotta) 0 6px, transparent 6px 12px); }
.timeline-step{ position:relative; padding-bottom:16px; }
.timeline-step:last-child{padding-bottom:0;}
.timeline-step::before{ content:''; position:absolute; left:-26px; top:2px; width:15px; height:15px; border-radius:50%; background:var(--mustard); border:2.5px solid var(--line); }
.timeline-step b{color:var(--terracotta-deep);}
.timeline-step .ts-desc{font-size:12.5px; color:#6b6152;}

/* ============ steps-row ============ */
.steps-row{ display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; align-items:stretch; }
.step-card{ flex:1; min-width:150px; background:#EAF1E7; border:2px solid var(--line); border-radius:16px; padding:14px; text-align:center; }
.step-card .step-num{ width:24px; height:24px; border-radius:50%; background:var(--green-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Baloo 2'; font-weight:800; margin:0 auto 8px auto; font-size:12.5px; }
.step-card p{margin:0; font-size:12.5px;}
.step-arrow{ align-self:center; color:var(--terracotta); font-size:20px; font-weight:900; }
@media (max-width:760px){.step-arrow{display:none;}}

/* ============ flip cards (food & souvenirs) ============ */
.flip-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin:12px 0 20px 0; }
@media (max-width:760px){.flip-grid{grid-template-columns:repeat(2,1fr);}}
.flip-card{ perspective:800px; height:118px; cursor:pointer; }
.flip-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
.flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
.flip-front,.flip-back{ position:absolute; inset:0; border-radius:16px; border:2px solid var(--line); backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; text-align:center; }
.flip-front{ background:#FBF6E9; }
.flip-front .fc-emoji{ font-size:30px; }
.flip-front .fc-name{ font-weight:800; font-size:12.5px; margin-top:4px; }
.flip-back{ background:var(--terracotta); color:#fff; transform:rotateY(180deg); font-size:11px; line-height:1.5; gap:4px; }
.flip-back .fc-stars{color:var(--mustard); font-size:12px;}
.souvenir-back{background:var(--sky-deep);}

/* ============ flight card ============ */
.flight-card{ background:#FBF6E9; border:2px solid var(--line); border-radius:16px; padding:14px 18px; margin:10px 0; }
.flight-route{ display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:14.5px; color:var(--ink); flex-wrap:wrap; gap:6px;}
.flight-route .fr-arrow{color:var(--terracotta); font-size:15px; margin:0 6px;}
.flight-time{font-family:'Baloo 2'; color:var(--sky-deep); font-weight:700; font-size:13.5px;}
.flight-meta{ display:flex; flex-wrap:wrap; gap:6px 8px; font-size:11.5px; color:#6b6152; margin-top:8px; }
.flight-meta span{ background:#fff; border:1.5px solid var(--line); padding:3px 10px; border-radius:10px; }

/* ============ day hero ============ */
.day-hero{ background:var(--green); color:#fff; border:2.5px solid var(--line); border-radius:20px; padding:16px 20px; margin-bottom:16px; }
.day-hero .dh-tag{ font-family:'Baloo 2'; font-size:11px; letter-spacing:2px; opacity:0.9; font-weight:700;}
.day-hero h1{ font-family:'Baloo 2'; font-weight:800; font-size:24px; margin:4px 0; color:#fff; }
.day-hero .dh-meta{ font-size:12.5px; opacity:0.95; display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
.day-hero .dh-meta span{background:rgba(255,255,255,0.2); padding:3px 12px; border-radius:12px; font-weight:700;}

.day-info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:12px 0; }
@media (max-width:760px){.day-info-grid{grid-template-columns:1fr;}}
.info-card{ border:2px solid var(--line); border-radius:16px; padding:14px 16px; }
.info-card.food{ background:#FBEEE6; }
.info-card.hotel{ background:#EAF1F4; }
.info-card .ic-title{ font-weight:800; font-size:13.5px; margin-bottom:6px; display:flex; gap:6px; align-items:center;}
.info-card.food .ic-title{color:var(--terracotta-deep);}
.info-card.hotel .ic-title{color:var(--sky-deep);}
.info-card p{margin:2px 0; font-size:12.5px;}

/* ============ checklist ============ */
.checklist{list-style:none; padding:0; margin:10px 0; display:grid; grid-template-columns:1fr 1fr; gap:6px 18px;}
.checklist li{ font-size:13px; padding:6px 0 6px 26px; position:relative; border-bottom:1.5px dotted #E4DAC0; }
.checklist li::before{ content:''; position:absolute; left:0; top:7px; width:15px; height:15px; border:2px solid var(--green-deep); border-radius:5px; }
@media (max-width:760px){.checklist{grid-template-columns:1fr;}}

/* ============ map ============ */
.map-wrap{ background:#FBF6E9; border:2px solid var(--line); border-radius:18px; padding:12px; margin:12px 0; }
.map-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:10px; font-size:11.5px; }
.map-legend span{ display:inline-flex; align-items:center; gap:5px; font-weight:700; }
.map-legend i{ width:14px; height:5px; border-radius:3px; display:inline-block; }

/* ============ COVER (full-bleed landscape illustration) ============ */
.cover-page{ position:relative; height:100%; overflow:hidden; background:#FBF1DE; }
.cover-page .cover-illustration{ position:absolute; inset:0; width:100%; height:100%; }
.cover-page .cover-illustration svg{ width:100%; height:100%; display:block; }
.cover-overlay{ position:relative; z-index:3; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:40px 30px 0 30px; text-align:center; pointer-events:none; }
.cover-title-panel{ background:rgba(251,241,222,0.88); border:2.5px solid var(--line); border-radius:24px; padding:16px 30px; box-shadow:4px 4px 0 rgba(34,31,25,0.15); }
.cover-title-panel .cover-sub{ font-family:'Baloo 2'; font-weight:700; font-size:12px; letter-spacing:4px; color:var(--green-deep); }
.cover-title-panel h1{ font-family:'Baloo 2'; font-weight:800; font-size:44px; color:var(--ink); margin:6px 0 0 0; line-height:1.2; }
.cover-dates{ margin-top:18px; background:var(--terracotta); color:#fff; font-weight:800; font-family:'Baloo 2'; padding:8px 24px; border:2.5px solid var(--line); border-radius:30px; font-size:14px; letter-spacing:1px; box-shadow:3px 3px 0 var(--line); pointer-events:auto; }

/* ============ controls ============ */
.controls{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:16px; background:#FFFCF3; border:2.5px solid var(--line); padding:9px 20px; border-radius:40px; z-index:10; box-shadow:4px 4px 0 rgba(34,31,25,0.15); }
.ctrl-btn{ background:var(--terracotta); color:#fff; border:2px solid var(--line); width:36px; height:36px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s; font-weight:900; }
.ctrl-btn:hover{transform:scale(1.08);}
.ctrl-btn:disabled{opacity:0.3; cursor:default;}
.ctrl-btn:disabled:hover{transform:none;}
.page-counter{color:var(--ink); font-family:'Baloo 2'; font-weight:700; font-size:13.5px; min-width:56px; text-align:center;}
.mobile-toggle{display:none;}

@media (max-width:900px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); transition:transform .25s; box-shadow:0 0 30px rgba(0,0,0,0.25); z-index:30;}
  .sidebar.open{transform:translateX(0);}
  .mobile-toggle{ display:flex; position:absolute; top:16px; left:16px; z-index:20; width:40px; height:40px; border-radius:50%; background:var(--terracotta); color:#fff; border:2px solid var(--line); align-items:center; justify-content:center; cursor:pointer; font-size:18px; }
  .stage{padding:70px 12px 90px 12px;}
  .page-scroll{padding:26px 18px 90px 18px;}
  h1.page-title{font-size:23px;}
  .cover-content h1{font-size:32px;}
  .two-col{grid-template-columns:1fr;}
  .flip-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="app">
  <div class="mobile-toggle" id="mobileToggle">☰</div>
  <nav class="sidebar" id="sidebar"></nav>
  <div class="stage">
    <div class="book" id="book"></div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn">‹</button>
      <div class="page-counter" id="pageCounter">1 / 21</div>
      <button class="ctrl-btn" id="nextBtn">›</button>
    </div>
  </div>
</div>
<script>
// ---------- helper: scattered dot texture (deterministic, no Math.random) ----------
function dotField(cx, cy, w, h, n, color, rMin, rMax){
  let out = '';
  for(let i=0;i<n;i++){
    const fx = (Math.sin(i*12.9898+cx)*43758.5453) % 1;
    const fy = (Math.sin(i*78.233+cy)*12543.123) % 1;
    const px = cx + ((fx<0?-fx:fx)) * w;
    const py = cy + ((fy<0?-fy:fy)) * h;
    const r = rMin + (((Math.sin(i*3.7)+1)/2) * (rMax-rMin));
    out += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r.toFixed(1)}" fill="${color}"/>`;
  }
  return out;
}

// ---------- full-bleed autumn landscape illustration for the cover (no people) ----------
const LANDSCAPE_ILLUSTRATION = `
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <rect width="800" height="500" fill="#FDF3D9"/>
  <circle cx="120" cy="95" r="58" fill="#E9E36B" opacity="0.9"/>
  <circle cx="120" cy="95" r="58" fill="none" stroke="#221F19" stroke-width="2" opacity="0.15"/>

  <!-- back mountain ridge -->
  <path d="M0 190 L90 110 L150 160 L230 80 L300 150 L380 95 L470 165 L560 100 L650 160 L730 120 L800 175 L800 260 L0 260 Z" fill="#BFE0DA"/>
  <path d="M150 160 L230 80 L300 150" fill="#FFFFFF" opacity="0.85"/>
  <path d="M380 95 L470 165" stroke="#FFFFFF" stroke-width="14" opacity="0.7"/>
  <path d="M560 100 L650 160" stroke="#FFFFFF" stroke-width="10" opacity="0.6"/>

  <!-- mid mountain ridge (teal) -->
  <path d="M0 240 L100 175 L190 225 L280 155 L370 220 L460 165 L560 230 L660 175 L800 235 L800 320 L0 320 Z" fill="#5FA9A0"/>
  <path d="M190 225 L280 155 L370 220" fill="#E9F4EC" opacity="0.55"/>

  <!-- pink blossom hillside accent -->
  <path d="M560 230 L660 175 L740 220 L800 200 L800 320 L560 320 Z" fill="#EFC9DA" opacity="0.7"/>
  ${dotField(600, 240, 190, 70, 40, '#DD8FA3', 3, 6)}

  <!-- rolling meadow hills -->
  <path d="M0 300 Q120 250 240 300 T480 300 T800 300 L800 500 L0 500 Z" fill="#C9D96B"/>
  ${dotField(30, 320, 350, 130, 70, '#EFBE4A', 2.5, 5)}
  ${dotField(420, 320, 380, 130, 70, '#8CAA8A', 2.5, 5)}

  <path d="M0 360 Q150 320 300 365 T600 360 T800 375 L800 500 L0 500 Z" fill="#9CC169"/>
  ${dotField(60, 380, 340, 100, 55, '#FDF3D9', 2, 4)}
  ${dotField(460, 385, 320, 100, 55, '#EFBE4A', 2, 4)}

  <!-- winding road -->
  <path d="M-20 470 C 120 430, 140 380, 260 360 S 420 300, 520 290 S 700 250, 830 230" fill="none" stroke="#F4EFE1" stroke-width="26" stroke-linecap="round"/>
  <path d="M-20 470 C 120 430, 140 380, 260 360 S 420 300, 520 290 S 700 250, 830 230" fill="none" stroke="#221F19" stroke-width="26" stroke-linecap="round" opacity="0.12"/>
  <path d="M-20 470 C 120 430, 140 380, 260 360 S 420 300, 520 290 S 700 250, 830 230" fill="none" stroke="#EFBE4A" stroke-width="3" stroke-dasharray="10 10" opacity="0.7"/>

  <!-- little travel van on the road -->
  <g transform="translate(330,335) rotate(-14)">
    <rect x="0" y="0" width="58" height="26" rx="8" fill="#E17F5A" stroke="#221F19" stroke-width="2.5"/>
    <rect x="38" y="-14" width="24" height="20" rx="6" fill="#E17F5A" stroke="#221F19" stroke-width="2.5"/>
    <rect x="42" y="-9" width="14" height="10" rx="2" fill="#BFE0DA"/>
    <circle cx="14" cy="27" r="7" fill="#221F19"/>
    <circle cx="46" cy="27" r="7" fill="#221F19"/>
    <circle cx="14" cy="27" r="3" fill="#F4EFE1"/>
    <circle cx="46" cy="27" r="3" fill="#F4EFE1"/>
  </g>

  <!-- larch / conifer clusters -->
  <g>
    <path d="M120 420 L134 380 L148 420 Z" fill="#8CAA8A" stroke="#221F19" stroke-width="2"/>

const DAY_COLORS = ['#E17F5A','#587C5C','#4C8FA3','#DD8FA3','#C99A2E','#B7A6D9'];
let dayColorIdx = 0;

function dayPage(opts){
  const color = DAY_COLORS[dayColorIdx % DAY_COLORS.length];
  dayColorIdx++;
  return `
<div class="day-banner" style="background:${color};">
  <div class="db-num">${opts.dayNum}</div>
  <div class="db-tag">${opts.date}</div>
  <h1>${opts.title}</h1>
  <div class="db-meta"><span>📍 ${opts.route}</span>${opts.carTime ? `<span>🚌 車程 ${opts.carTime}</span>` : ''}</div>
</div>
${opts.highlights}
${opts.food || opts.hotel ? `<div class="section-divider"><div class="sd-circle">✈</div></div><div class="day-info-grid">
  ${opts.food ? `<div class="info-card food"><div class="ic-title">🍜 吃什麼</div>${opts.food}</div>` : ''}
  ${opts.hotel ? `<div class="info-card hotel"><div class="ic-title">🏨 住宿</div>${opts.hotel}</div>` : ''}
</div>` : ''}
${opts.knowledge ? `<div class="callout green">📚 小知識：${opts.knowledge}</div>` : ''}
${opts.egg ? `<div class="egg-task"><div class="egg-label">📌 彩蛋任務：${opts.eggTitle}</div>${opts.egg}</div>` : ''}
`;
}

// ---------- RENDER SIDEBAR ----------
const sidebar = document.getElementById('sidebar');
let sidebarHTML = `<div class="sidebar-brand">北疆金秋手冊<span>NORTH XINJIANG GUIDE</span></div>`;
let lastChapter = null;
PAGES.forEach((p, i) => {
  if(p.chapter !== lastChapter){
    sidebarHTML += `<div class="chapter-label">${p.chapter}</div>`;
    lastChapter = p.chapter;
  }
  sidebarHTML += `<div class="nav-item" data-idx="${i}"><span class="num">${p.num || '◆'}</span><span>${p.navLabel}</span></div>`;
});
sidebar.innerHTML = sidebarHTML;

// ---------- RENDER BOOK ----------
const book = document.getElementById('book');
book.innerHTML = PAGES.map((p, i) => `
  <div class="page-card" data-idx="${i}">
    ${p.isCover ? p.html : `
      <div class="page-scroll">
        <div class="page-topbar"><span>北疆金秋大冒險</span><span class="chip">${p.chapter}</span></div>
        ${p.html}
      </div>
    `}
  </div>
`).join('');

// flip-card click handling
book.addEventListener('click', (e) => {
  const card = e.target.closest('.flip-card');
  if(card) card.classList.toggle('flipped');
});

// ---------- NAVIGATION LOGIC ----------
let current = 0;
const cards = document.querySelectorAll('.page-card');
const navItems = document.querySelectorAll('.nav-item');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageCounter = document.getElementById('pageCounter');

function goTo(idx){
  if(idx < 0 || idx >= PAGES.length) return;
  cards.forEach((c, i) => {
    c.classList.remove('active','prev');
    if(i === idx) c.classList.add('active');
    else if(i < idx) c.classList.add('prev');
  });
  navItems.forEach(n => n.classList.toggle('active', parseInt(n.dataset.idx) === idx));
  pageCounter.textContent = `${idx+1} / ${PAGES.length}`;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === PAGES.length - 1;
  current = idx;
  const activeNav = document.querySelector('.nav-item.active');
  if(activeNav) activeNav.scrollIntoView({block:'nearest'});
  const scrollEl = cards[idx].querySelector('.page-scroll');
  if(scrollEl) scrollEl.scrollTop = 0;
}

navItems.forEach(item => {
  item.addEventListener('click', () => {
    goTo(parseInt(item.dataset.idx));
    if(window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open');
  });
});
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goTo(current + 1);
  if(e.key === 'ArrowLeft') goTo(current - 1);
});
document.getElementById('mobileToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

goTo(0);

</script>
